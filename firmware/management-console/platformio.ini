[platformio]
default_envs = lilygo-s3
boards_dir = boards
build_dir = ${sysenv.HOME}/.cache/flockinator-platformio/build
libdeps_dir = ${sysenv.HOME}/.cache/flockinator-platformio/libdeps

[env]
extra_scripts = pre:../node-platform/scripts/appledouble.py

[env:native]
platform = native@1.2.1
test_framework = unity
test_build_src = no
build_flags = -std=c++17 -Wall -Wextra -Werror

[env:lilygo-s3]
platform = espressif32@6.12.0
board = T5-ePaper-S3
framework = arduino
platform_packages =
    platformio/framework-arduinoespressif32@3.20017.241212+sha.dcc1105b
build_unflags = -std=gnu++11
monitor_speed = 115200
upload_speed = 460800
build_flags =
    -std=gnu++17
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=0
    -DLILYGO_T5_EPD47_S3
    -include math.h
lib_deps =
    https://github.com/Xinyuan-LilyGO/LilyGo-EPD47.git#50224221fb81a8fcf9068532374b775af84a38d4
    lewisxhe/SensorLib@0.3.1
    lennarthennigs/Button2@2.3.2
    bblanchon/ArduinoJson@7.4.3
