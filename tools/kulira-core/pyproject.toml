[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kulira-core"
version = "0.1.0"
description = "Kulira chaos orchestrator core (SPEC-kulira-core)"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
report = ["pillow>=10"]
slate = ["pillow>=10", "segno>=1.6"]

[project.scripts]
kulira = "kulira_core.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[tool.hatch.build.targets.wheel]
packages = ["kulira_core"]

[tool.pytest.ini_options]
testpaths = ["."]
